<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro - Hotel Sheraton</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <h1>Registro de Huésped</h1>
  <form id="form-registro">
    <input type="email" id="email" placeholder="Email" required><br><br>
    <input type="password" id="password" placeholder="Contraseña (mín. 6 caracteres)" required><br><br>
    <input type="text" id="nombre" placeholder="Nombre completo" required><br><br>
    <input type="tel" id="telefono" placeholder="Teléfono"><br><br>
    <button type="submit">Registrarse</button>
  </form>
  <p>¿Ya tienes cuenta? <a href="/login.html">Inicia sesión</a></p>
  <div id="mensaje"></div>

  <script type="module" src="/js/registro.js"></script>
</body>
</html>
