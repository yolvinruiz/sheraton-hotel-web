<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administrar Habitaciones - Sheraton</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="/css/main.css" />
  <style>
    .admin-section { padding: 40px 0; }
    .admin-header { text-align: center; margin-bottom: 30px; }
    .admin-actions { text-align: center; margin: 20px 0; }
    .search-box { text-align: center; margin: 20px 0; }
    .search-box input {
      padding: 10px;
      width: 100%;
      max-width: 500px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .result-card {
      background: white;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .result-card h4 {
      color: var(--primary);
      margin-bottom: 8px;
    }
    .card-actions {
      margin-top: 12px;
      display: flex;
      gap: 8px;
    }
    .btn-sm {
      padding: 6px 10px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <div class="container">
      <nav class="navbar">
        <div class="logo">
          <img src="https://cache.marriott.com/content/dam/marriott-digital/si/global-property-shared/en_us/logo/assets/si_logo_L.png" alt="Sheraton Logo">
        </div>
        <ul class="nav-links">
          <li><a href="/admin-dashboard.html">Dashboard</a></li>
          <li><a href="/admin-habitaciones.html" class="active">Habitaciones</a></li>
          <li><a href="/admin-servicios.html">Servicios</a></li>
          <li><a href="/admin-reservas.html">Reservas</a></li>
        </ul>
        <div class="nav-buttons">
          <a href="#" class="btn" id="logout-btn">Cerrar Sesión</a>
        </div>
      </nav>
    </div>
  </header>

  <!-- Sección de Administración -->
  <section class="section admin-section">
    <div class="container">
      <div class="admin-header">
        <h2>Administrar Habitaciones</h2>
        <p>Tipos y unidades de habitación del hotel.</p>
      </div>

      <div class="admin-actions">
        <button id="btn-agregar-tipo" class="btn">
          <i class="fas fa-plus"></i> Agregar Tipo
        </button>
        <button id="btn-agregar-unidad" class="btn btn-secondary" style="margin-left: 10px;">
          <i class="fas fa-plus"></i> Agregar Unidad
        </button>
      </div>

      <div class="search-box">
        <input type="text" id="busqueda-habitaciones" placeholder="Buscar por nombre o número...">
      </div>

      <div id="resultados-container">
        <p>Cargando...</p>
      </div>
    </div>
  </section>

  <!-- Modal: Agregar/Editar Tipo -->
  <div class="modal" id="modal-tipo">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="titulo-modal-tipo">Agregar Tipo de Habitación</h2>
        <button class="close-modal">&times;</button>
      </div>
      <div class="modal-body">
        <form id="form-tipo">
          <input type="hidden" id="tipo-id">
          <div class="form-group">
            <label>Nombre</label>
            <input type="text" class="form-control" id="tipo-nombre" required>
          </div>
          <div class="form-group">
            <label>Tipo (ej: deluxe, suite)</label>
            <input type="text" class="form-control" id="tipo-tipo" required>
          </div>
          <div class="form-group">
            <label>Precio por noche (S/)</label>
            <input type="number" class="form-control" id="tipo-precio" min="0" required>
          </div>
          <div class="form-group">
            <label>Capacidad</label>
            <input type="number" class="form-control" id="tipo-capacidad" min="1" required>
          </div>
          <div class="form-group">
            <label>Vista</label>
            <select class="form-control" id="tipo-vista" required>
              <option value="ciudad">Ciudad</option>
              <option value="mar">Mar</option>
              <option value="jardín">Jardín</option>
              <option value="piscina">Piscina</option>
            </select>
          </div>
          <div class="form-group">
            <label>Incluye desayuno</label>
            <select class="form-control" id="tipo-desayuno" required>
              <option value="true">Sí</option>
              <option value="false">No</option>
            </select>
          </div>
          <div class="form-group">
            <label>Descripción</label>
            <textarea class="form-control" id="tipo-descripcion" rows="3" required></textarea>
          </div>
          <div class="form-group">
            <label>URL de imagen</label>
            <input type="url" class="form-control" id="tipo-imagen">
          </div>
          <div class="form-group">
  <img id="preview-imagen-tipo" src="" alt="Vista previa" style="max-width: 100%; margin-top: 10px; display: none;">
</div>
          <button type="submit" class="btn" style="width: 100%;">Guardar</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal: Agregar/Editar Unidad -->
  <div class="modal" id="modal-unidad">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="titulo-modal-unidad">Agregar Unidad de Habitación</h2>
        <button class="close-modal">&times;</button>
      </div>
      <div class="modal-body">
        <form id="form-unidad">
          <input type="hidden" id="unidad-id">
          <div class="form-group">
            <label>Número</label>
            <input type="number" class="form-control" id="unidad-numero" min="1" required>
          </div>
          <div class="form-group">
            <label>Tipo</label>
            <select class="form-control" id="unidad-tipoId" required></select>
          </div>
          <div class="form-group">
            <label>Piso</label>
            <input type="number" class="form-control" id="unidad-piso" min="1" required>
          </div>
          <div class="form-group">
            <label>Estado</label>
            <select class="form-control" id="unidad-estado" required>
              <option value="disponible">Disponible</option>
              <option value="mantenimiento">Mantenimiento</option>
            </select>
          </div>
          <button type="submit" class="btn" style="width: 100%;">Guardar</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal: Ver Unidades de un Tipo -->
  <div class="modal" id="modal-unidades-tipo">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Unidades: <span id="nombre-tipo"></span></h2>
        <button class="close-modal">&times;</button>
      </div>
      <div class="modal-body">
        <div id="lista-unidades-tipo">
          <p>Cargando unidades...</p>
        </div>
      </div>
    </div>
  </div>
  <script>
  // Prueba básica: abrir modales
  document.getElementById('btn-agregar-tipo')?.addEventListener('click', () => {
    document.getElementById('modal-tipo').style.display = 'flex';
    document.body.style.overflow = 'hidden';
  });

  document.getElementById('btn-agregar-unidad')?.addEventListener('click', () => {
    document.getElementById('modal-unidad').style.display = 'flex';
    document.body.style.overflow = 'hidden';
  });

  // Cerrar modales
  document.querySelectorAll('.close-modal').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
      document.body.style.overflow = 'auto';
    });
  });

  // Cerrar al hacer clic fuera
  document.querySelectorAll('.modal').forEach(modal => {
    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        modal.style.display = 'none';
        document.body.style.overflow = 'auto';
      }
    });
  });
  document.getElementById('tipo-imagen')?.addEventListener('input', (e) => {
  const preview = document.getElementById('preview-imagen-tipo');
  if (e.target.value) {
    preview.src = e.target.value;
    preview.style.display = 'block';
  } else {
    preview.style.display = 'none';
  }
});
</script>
<script type="module" src="/js/firebase/config.js"></script>
<script type="module" src="/js/firebase/services/tipoHabitacionService.js"></script>
<script type="module" src="/js/firebase/services/unidadHabitacionService.js"></script>
<script type="module" src="/js/admin/adminHabitaciones.js"></script>
</body>
</html>
