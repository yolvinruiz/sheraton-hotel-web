<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administradores</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { font-family: Arial; background:#f5f5f5; padding:0; margin:0; display:flex; 
               justify-content:center; align-items:center; height:100vh; }
        .card { background:white; padding:30px; width:380px; border-radius:10px; 
                box-shadow:0 4px 10px rgba(0,0,0,.1); }
        h2 { text-align:center; margin-bottom:20px; color:#004792; }
        .form-group { margin-bottom:15px; }
        label { font-weight:bold; font-size:.9rem; }
        input { width:100%; padding:10px; margin-top:5px; border:1px solid #ccc; 
                border-radius:6px; }
        button { width:100%; padding:12px; border:none; border-radius:6px; 
                 background:#004792; color:white; cursor:pointer; }
        button:hover { background:#00376d; }
        small { color:red; display:none; }
        .toggle-link { text-align:center; margin-top:12px; cursor:pointer; color:#004792; }
    </style>
</head>
<body>

<div class="card" id="login-card">
    <h2>Ingreso Administrador</h2>
    
    <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email">
    </div>

    <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="login-password">
    </div>

    <small id="login-error"></small>

    <button id="btn-login">Iniciar Sesión</button>

    <div class="toggle-link" onclick="showRegister()">Registrar Administrador</div>
</div>

<div class="card" id="register-card" style="display:none;">
    <h2>Registro de Administrador</h2>

    <div class="form-group">
        <label>Nombre</label>
        <input type="text" id="reg-nombre">
    </div>

    <div class="form-group">
        <label>Apellidos</label>
        <input type="text" id="reg-apellidos">
    </div>

    <div class="form-group">
        <label>DNI</label>
        <input type="text" id="reg-dni">
    </div>

    <div class="form-group">
        <label>Teléfono</label>
        <input type="text" id="reg-telefono">
    </div>

    <div class="form-group">
        <label>Email</label>
        <input type="email" id="reg-email">
    </div>

    <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="reg-password">
    </div>

    <div class="form-group">
        <label>Clave de Registro (Administrador)</label>
        <input type="password" id="clave-admin" placeholder="Ingresa la clave 240504">
    </div>

    <small id="register-error"></small>

    <button id="btn-register">Crear Cuenta</button>

    <div class="toggle-link" onclick="showLogin()">Volver al Login</div>
</div>
<script type="module" src="js/firebase/config.js"></script>
<script type="module" src="js/admin/admin-auth.js"></script>
</body>
</html>
