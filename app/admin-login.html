<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Administrador</title>
  <style>
    /* Variables de colores */
    :root {
      --primary-color: #4361ee;
      --primary-dark: #3a56d4;
      --secondary-color: #7209b7;
      --light-color: #f8f9fa;
      --dark-color: #212529;
      --success-color: #4cc9f0;
      --error-color: #f72585;
      --border-radius: 12px;
      --box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    /* Reset y estilos generales */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
    }

    .login-box {
      background-color: white;
      border-radius: var(--border-radius);
      box-shadow: var(--box-shadow);
      padding: 40px 30px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* Efecto decorativo superior */
    .login-box::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 5px;
      background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
    }

    .login-box h2 {
      color: var(--dark-color);
      margin-bottom: 30px;
      font-size: 28px;
      font-weight: 600;
      position: relative;
      padding-bottom: 15px;
    }

    .login-box h2::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 3px;
      background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
      border-radius: 2px;
    }

    .input-group {
      position: relative;
      margin-bottom: 25px;
    }

    .input-group input {
      width: 100%;
      padding: 15px 15px 15px 45px;
      border: 2px solid #e1e5ee;
      border-radius: var(--border-radius);
      font-size: 16px;
      background-color: #f9fafc;
      transition: all 0.3s ease;
    }

    .input-group input:focus {
      outline: none;
      border-color: var(--primary-color);
      background-color: white;
      box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.15);
    }

    .input-group i {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #a0a4b8;
      font-size: 18px;
      transition: color 0.3s ease;
    }

    .input-group input:focus + i {
      color: var(--primary-color);
    }

    #btnLoginAdmin {
      width: 100%;
      padding: 15px;
      background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
      color: white;
      border: none;
      border-radius: var(--border-radius);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
    }

    #btnLoginAdmin:hover {
      background: linear-gradient(to right, var(--primary-dark), #6310a3);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }

    #btnLoginAdmin:active {
      transform: translateY(0);
    }

    #errorMsg {
      color: var(--error-color);
      margin-top: 15px;
      font-size: 14px;
      min-height: 20px;
      transition: all 0.3s ease;
    }

    /* Estilos para el icono de administrador */
    .admin-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 32px;
    }

    /* Estilos responsivos */
    @media (max-width: 480px) {
      .login-box {
        padding: 30px 20px;
      }
      
      .login-box h2 {
        font-size: 24px;
      }
    }

    /* Animación para el mensaje de error */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
      20%, 40%, 60%, 80% { transform: translateX(5px); }
    }

    .shake {
      animation: shake 0.5s ease-in-out;
    }
  </style>
  <!-- Agregamos Font Awesome para los iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

  <div class="login-container">
    <div class="login-box">
      <div class="admin-icon">
        <i class="fas fa-user-shield"></i>
      </div>
      <h2>Administrador</h2>

      <div class="input-group">
        <input type="email" id="email" placeholder="Correo electrónico" required>
        <i class="fas fa-envelope"></i>
      </div>

      <div class="input-group">
        <input type="password" id="password" placeholder="Contraseña" required>
        <i class="fas fa-lock"></i>
      </div>

      <button id="btnLoginAdmin">Ingresar</button>

      <p id="errorMsg"></p>
    </div>
  </div>

  <script type="module" src="./js/admin/adminLogin.js"></script>
  <script>
    // Script básico para mostrar errores (simulado)
    document.addEventListener('DOMContentLoaded', function() {
      const btnLogin = document.getElementById('btnLoginAdmin');
      const errorMsg = document.getElementById('errorMsg');
      
      btnLogin.addEventListener('click', function() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        
        // Simulación de validación
        if (!email || !password) {
          errorMsg.textContent = "Por favor, complete todos los campos";
          errorMsg.classList.add('shake');
          setTimeout(() => errorMsg.classList.remove('shake'), 500);
        } else {
          errorMsg.textContent = "";
          // Aquí iría la lógica real de autenticación
          console.log("Iniciando sesión...");
        }
      });
    });
  </script>
</body>
</html>
